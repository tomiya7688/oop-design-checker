name: validate-release-fixture

on:
  push:
    branches:
      - test/102-release-validation-fixture

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build fixture
        run: dotnet build tests/fixtures/release-validation-csharp/ReleaseValidation.csproj --configuration Release

      - name: Run checker against fixture
        shell: bash
        run: |
          set +e
          dotnet run --project src/frontends/cui -- tests/fixtures/release-validation-csharp --format json --output fixture.json --fail-on danger
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "checker runtime failure"
            exit 2
          fi
          cat fixture.json

      - name: Verify all rule IDs are represented
        shell: pwsh
        run: |
          $actual = Get-Content fixture.json -Raw | ConvertFrom-Json
          $expected = Get-Content tests/fixtures/release-validation-csharp/expected-diagnostics.json -Raw | ConvertFrom-Json
          $actualRuleIds = @($actual.diagnostics | ForEach-Object { $_.ruleId } | Sort-Object -Unique)
          $requiredRuleIds = @($expected.requiredDiagnostics | ForEach-Object { $_.ruleId } | Sort-Object -Unique)
          $missing = @($requiredRuleIds | Where-Object { $_ -notin $actualRuleIds })
          if ($missing.Count -gt 0) {
            throw "Missing required rule IDs: $($missing -join ', ')"
          }
          Write-Host "Observed rule IDs: $($actualRuleIds -join ', ')"
