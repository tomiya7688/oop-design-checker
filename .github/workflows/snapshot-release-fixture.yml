name: snapshot-release-fixture

on:
  push:
    branches:
      - test/103-release-fixture-exact-ci

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run fixture
        shell: pwsh
        run: |
          $root = (Resolve-Path "tests/fixtures/release-validation-csharp").Path
          $out = Join-Path $env:RUNNER_TEMP "fixture.json"
          dotnet run --project src/frontends/cui -- $root --format json --output $out --fail-on danger
          if ($LASTEXITCODE -eq 2) { throw "checker runtime failure" }

          $json = Get-Content $out -Raw | ConvertFrom-Json
          $items = @(
            $json.diagnostics |
              ForEach-Object {
                [pscustomobject]@{
                  ruleId = $_.ruleId
                  severity = $_.severity
                  file = [IO.Path]::GetRelativePath($root, $_.file).Replace("\\", "/")
                  symbol = $_.symbol
                  line = $_.line
                  column = $_.column
                }
              } |
              Sort-Object file,line,column,ruleId,symbol
          )
          Write-Host "SNAPSHOT_BEGIN"
          $items | ConvertTo-Json -Depth 5 -Compress
          Write-Host "SNAPSHOT_END"
