name: ui-ai-contract

on:
  pull_request:
    paths:
      - '.github/actions/setup-python-trust/**'
      - 'tools/oop-design-checker/tests/python-security/**'
      - '.github/workflows/ui-ai-contract.yml'
      - 'tools/oop-design-checker/tests/ui-ai-judge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-trust

      - name: Install contract dependency
        run: |
          python -m pip install 'jsonschema>=4,<5'
          python tools/oop-design-checker/tests/python-security/audit_python_trust.py

      - name: Compile harness
        run: python -m py_compile tools/oop-design-checker/tests/ui-ai-judge/judge.py tools/oop-design-checker/tests/ui-ai-judge/aggregate.py

      - name: Test provider and consensus contracts
        run: python -m unittest discover -s tools/oop-design-checker/tests/ui-ai-judge -p 'test_*.py' -v
