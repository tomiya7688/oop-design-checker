name: release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Directory.Build.props'
      - 'CHANGELOG.md'
      - 'CHANGELOG.en.md'
      - 'src/OopDesignChecker/**'
      - 'src/frontends/cui/**'
      - 'oop-design-checker.example.json'
      - 'README.md'
      - 'README.en.md'
      - 'specification/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      product-version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Read and validate product version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read VersionPrefix from Directory.Build.props." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match declared version v${version}." >&2
            exit 1
          fi

          echo "value=${version}" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.rid }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: win-arm64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.product-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish CUI
        run: >-
          dotnet publish src/frontends/cui/OopDesignChecker.Cui.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ needs.version.outputs.product-version }}
          --output publish/${{ matrix.rid }}

      - name: Include Roslyn MSBuild build host
        shell: pwsh
        run: |
          $buildHost = Get-ChildItem (Join-Path $HOME ".nuget/packages") -Recurse -Filter "Microsoft.CodeAnalysis.Workspaces.MSBuild.BuildHost.dll" |
            Where-Object { $_.FullName -match "[\\/]BuildHost-netcore[\\/]" } |
            Select-Object -First 1
          if ($null -eq $buildHost) {
            throw "Could not locate Roslyn BuildHost-netcore in the NuGet package cache."
          }

          $destination = Join-Path "publish/${{ matrix.rid }}" "BuildHost-netcore"
          Copy-Item $buildHost.Directory.FullName $destination -Recurse -Force

      - name: Smoke test packaged CUI against SDK project folder
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "oop-checker-release-folder-smoke"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Set-Content -Path (Join-Path $target "FolderSmoke.csproj") -Value @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
          </Project>
          "@
          Set-Content -Path (Join-Path $target "Sample.cs") -Value "internal sealed class Sample { private int _value; public int Value => _value; }"

          if ($IsWindows) {
            $checker = Join-Path "publish/${{ matrix.rid }}" "oop-design-checker-cui.exe"
          } else {
            $checker = Join-Path "publish/${{ matrix.rid }}" "oop-design-checker-cui"
          }

          $output = Join-Path $target "diagnostics.json"
          & $checker $target --format json --output $output --fail-on danger
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged checker failed to analyze an SDK project folder with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path $output)) {
            throw "Packaged checker did not produce the expected JSON output."
          }
      - name: Add documentation and configuration example
        shell: bash
        run: |
          cp README.md publish/${{ matrix.rid }}/README.md
          cp README.en.md publish/${{ matrix.rid }}/README.en.md
          cp CHANGELOG.md publish/${{ matrix.rid }}/CHANGELOG.md
          cp CHANGELOG.en.md publish/${{ matrix.rid }}/CHANGELOG.en.md
          cp oop-design-checker.example.json publish/${{ matrix.rid }}/oop-design-checker.example.json
          cp -R specification publish/${{ matrix.rid }}/specification

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "dist/oop-design-checker-$env:PACKAGE_VERSION-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $archive

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/oop-design-checker-${PACKAGE_VERSION}-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" .

      - name: Generate archive checksum
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          archives = [path for path in Path('dist').iterdir() if path.suffix in {'.zip', '.gz'}]
          if len(archives) != 1:
              raise SystemExit(f'Expected one release archive, found {len(archives)}')

          archive = archives[0]
          digest = sha256(archive.read_bytes()).hexdigest()
          archive.with_name(f'{archive.name}.sha256').write_text(
              f'{digest}  {archive.name}\n', encoding='utf-8'
          )
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: oop-design-checker-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: oop-design-checker-*
          path: dist
          merge-multiple: true

      - name: Build combined checksum manifest
        shell: bash
        run: cat dist/*.sha256 > dist/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "oop-design-checker ${GITHUB_REF_NAME}"
