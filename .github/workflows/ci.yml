name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  normal-ci:
    name: normal-ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tools/oop-design-checker/OopDesignChecker.sln

      - name: Build
        run: dotnet build tools/oop-design-checker/OopDesignChecker.sln -c Release --no-restore

      - name: Rule smoke tests
        run: dotnet run --project tools/oop-design-checker/tests/OopDesignChecker.Tests/OopDesignChecker.Tests.csproj -c Release --no-build

      - name: CLI contract tests
        run: dotnet run --project tools/oop-design-checker/tests/OopDesignChecker.ContractTests/OopDesignChecker.ContractTests.csproj -c Release --no-build

      - name: Headless UI structural tests
        run: dotnet run --project tools/oop-design-checker/tests/OopDesignChecker.Gui.HeadlessTests/OopDesignChecker.Gui.HeadlessTests.csproj -c Release --no-build

  ui-headless:
    name: ui-headless
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Headless UI canonical visual regression
        env:
          OOP_DESIGN_CHECKER_UI_VISUAL_REGRESSION: '1'
          UI_EVIDENCE_DIR: ${{ runner.temp }}/ui-evidence
        run: >-
          dotnet run
          --project tools/oop-design-checker/tests/OopDesignChecker.Gui.HeadlessTests/OopDesignChecker.Gui.HeadlessTests.csproj
          -c Release

      - name: Upload headless UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-headless-evidence
          path: ${{ runner.temp }}/ui-evidence
          if-no-files-found: error
          retention-days: 30

  specification-contract:
    name: specification-contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-trust

      - name: Validate 1.0.0 specification contract
        run: python tools/oop-design-checker/tests/release/SpecificationContract.py

  self-check:
    name: self-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-trust

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tools/oop-design-checker/OopDesignChecker.sln

      - name: Build checker
        run: dotnet build tools/oop-design-checker/OopDesignChecker.sln -c Release --no-restore

      - name: Strict multi-project self-check
        run: dotnet run --project tools/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- tools/oop-design-checker/src --fail-on attention

      - name: Machine-readable output smoke test
        shell: bash
        run: |
          dotnet run --project tools/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- tools/oop-design-checker/src --fail-on attention --format json --output oop-diagnostics.json
          dotnet run --project tools/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- tools/oop-design-checker/src --fail-on attention --format sarif --output oop-diagnostics.sarif
          python - <<'PY'
          import json
          with open('oop-diagnostics.json', encoding='utf-8-sig') as stream:
              json_doc = json.load(stream)
          assert json_doc['version'] == 1
          with open('oop-diagnostics.sarif', encoding='utf-8-sig') as stream:
              sarif_doc = json.load(stream)
          assert sarif_doc['version'] == '2.1.0'
          assert len(sarif_doc['runs']) == 1
          PY

      - name: GitHub annotation output smoke test
        shell: bash
        run: |
          cat > oop-annotation-sample.cs <<'EOF'
          internal sealed class Sample
          {
              private int _value;
              public int Add(int left, int right) => left + right;
              public int AddValue(int value) => value + _value;
          }
          EOF
          output="$(dotnet run --project tools/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- oop-annotation-sample.cs --fail-on danger --format github)"
          printf '%s\n' "$output"
          grep -q '^::notice ' <<< "$output"
          rm oop-annotation-sample.cs

      - name: Solution loading smoke test
        run: dotnet run --project tools/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- tools/oop-design-checker/OopDesignChecker.sln --fail-on danger

      - name: SLNX loading smoke test
        shell: bash
        run: |
          cat > oop-design-checker-ci.slnx <<'EOF'
          <Solution>
            <Project Path="tools/oop-design-checker/src/OopDesignChecker/OopDesignChecker.csproj" />
            <Project Path="tools/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj" />
          </Solution>
          EOF
          dotnet run --project tools/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- oop-design-checker-ci.slnx --fail-on danger
          rm oop-design-checker-ci.slnx

  code-analyzers:
    name: code-analyzers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tools/oop-design-checker/OopDesignChecker.sln

      - name: .NET analyzers
        run: dotnet build tools/oop-design-checker/OopDesignChecker.sln -c Release --no-restore -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest-recommended -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true

  csharpier:
    name: csharpier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        working-directory: tools/oop-design-checker
        run: dotnet tool restore

      - name: Check formatting
        working-directory: tools/oop-design-checker
        run: dotnet csharpier check .

  python-security:
    name: python-security (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-trust
      - name: Test Python trust policy
        run: python -m unittest discover -s tools/oop-design-checker/tests/python-security -p 'test_*.py' -v
      - name: Test release artifact and provenance contracts
        run: python -m unittest discover -s tools/oop-design-checker/tests/release-provenance -p 'test_*.py' -v
      - name: Test local check selection and failure handling
        run: python -B tools/local-check/run_tests.py tools/local-check
      - name: Record actual Python trust sources
        shell: bash
        run: |
          set -euo pipefail
          python tools/oop-design-checker/tests/python-security/audit_python_trust.py | tee python-trust-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-trust-${{ matrix.os }}
          path: python-trust-audit.json
          if-no-files-found: warn

  support-formatting:
    name: support-formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-trust
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned formatters
        run: |
          python -m pip install -r tools/formatting/requirements.txt
          npm ci --prefix tools/formatting --ignore-scripts --no-audit --no-fund
      - name: Check Python security formatting
        run: python -m ruff format --check --config tools/formatting/ruff.toml tools/oop-design-checker/tests/python-security tools/oop-design-checker/tests/release-provenance tools/local-check check_local.py
      - name: Check workflow and documentation formatting
        run: npm run --prefix tools/formatting format:check -- ../../.github/actions/setup-python-trust/action.yml ../../.github/actions/attest-release/action.yml ../../.github/workflows/ci.yml ../../.github/workflows/release-candidate.yml ../../.github/workflows/release.yml ../../.github/workflows/ui-ai-contract.yml ../../.github/workflows/ui-ai-panel.yml ../../.github/workflows/ui-appium.yml ../oop-design-checker/tests/ui-appium/check-node-version.cjs ../oop-design-checker/tests/ui-appium/test-node-version.cjs ../../README.md ../../README.en.md ../oop-design-checker/docs/python-trust.md ../oop-design-checker/docs/release-authenticity.md package.json package-lock.json .prettierrc.json README.md ../local-check/README.md
