name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  normal-ci:
    name: normal-ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OopDesignChecker.sln

      - name: Build
        run: dotnet build OopDesignChecker.sln -c Release --no-restore

      - name: Rule smoke tests
        run: dotnet run --project tests/OopDesignChecker.Tests/OopDesignChecker.Tests.csproj -c Release --no-build

  self-check:
    name: self-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OopDesignChecker.sln

      - name: Build checker
        run: dotnet build OopDesignChecker.sln -c Release --no-restore

      - name: Strict OOP self-check
        shell: bash
        run: |
          dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- src/OopDesignChecker/OopDesignChecker.csproj --fail-on attention
          dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- src/frontends/cui/OopDesignChecker.Cui.csproj --fail-on attention
          dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- src/frontends/gui/OopDesignChecker.Gui.csproj --fail-on attention

  code-analyzers:
    name: code-analyzers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OopDesignChecker.sln

      - name: .NET analyzers
        run: dotnet build OopDesignChecker.sln -c Release --no-restore -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest-recommended -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true

  csharpier:
    name: csharpier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .
