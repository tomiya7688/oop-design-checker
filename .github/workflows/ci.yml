name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  normal-ci:
    name: normal-ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OopDesignChecker.sln

      - name: Build
        run: dotnet build OopDesignChecker.sln -c Release --no-restore

      - name: Rule smoke tests
        run: dotnet run --project tests/OopDesignChecker.Tests/OopDesignChecker.Tests.csproj -c Release --no-build

      - name: CLI contract tests
        run: dotnet run --project tests/OopDesignChecker.ContractTests/OopDesignChecker.ContractTests.csproj -c Release --no-build

      - name: Headless UI structural tests
        run: dotnet run --project tests/OopDesignChecker.Gui.HeadlessTests/OopDesignChecker.Gui.HeadlessTests.csproj -c Release --no-build

  ui-headless:
    name: ui-headless
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Headless UI canonical visual regression
        env:
          OOP_DESIGN_CHECKER_UI_VISUAL_REGRESSION: '1'
          UI_EVIDENCE_DIR: ${{ runner.temp }}/ui-evidence
        run: >-
          dotnet run
          --project tests/OopDesignChecker.Gui.HeadlessTests/OopDesignChecker.Gui.HeadlessTests.csproj
          -c Release

      - name: Upload headless UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-headless-evidence
          path: ${{ runner.temp }}/ui-evidence
          if-no-files-found: error
          retention-days: 30

  specification-contract:
    name: specification-contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate 1.0.0 specification contract
        run: python tests/release/SpecificationContract.py

  self-check:
    name: self-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OopDesignChecker.sln

      - name: Build checker
        run: dotnet build OopDesignChecker.sln -c Release --no-restore

      - name: Strict multi-project self-check
        run: dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- src --fail-on attention

      - name: Machine-readable output smoke test
        shell: bash
        run: |
          dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- src --fail-on attention --format json --output oop-diagnostics.json
          dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- src --fail-on attention --format sarif --output oop-diagnostics.sarif
          python - <<'PY'
          import json
          with open('oop-diagnostics.json', encoding='utf-8-sig') as stream:
              json_doc = json.load(stream)
          assert json_doc['version'] == 1
          with open('oop-diagnostics.sarif', encoding='utf-8-sig') as stream:
              sarif_doc = json.load(stream)
          assert sarif_doc['version'] == '2.1.0'
          assert len(sarif_doc['runs']) == 1
          PY

      - name: GitHub annotation output smoke test
        shell: bash
        run: |
          cat > oop-annotation-sample.cs <<'EOF'
          internal sealed class Sample
          {
              private int _value;
              public int Add(int left, int right) => left + right;
              public int AddValue(int value) => value + _value;
          }
          EOF
          output="$(dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- oop-annotation-sample.cs --fail-on danger --format github)"
          printf '%s\n' "$output"
          grep -q '^::notice ' <<< "$output"
          rm oop-annotation-sample.cs

      - name: Solution loading smoke test
        run: dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- OopDesignChecker.sln --fail-on danger

      - name: SLNX loading smoke test
        shell: bash
        run: |
          cat > oop-design-checker-ci.slnx <<'EOF'
          <Solution>
            <Project Path="src/OopDesignChecker/OopDesignChecker.csproj" />
            <Project Path="src/frontends/cui/OopDesignChecker.Cui.csproj" />
          </Solution>
          EOF
          dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- oop-design-checker-ci.slnx --fail-on danger
          rm oop-design-checker-ci.slnx

  code-analyzers:
    name: code-analyzers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OopDesignChecker.sln

      - name: .NET analyzers
        run: dotnet build OopDesignChecker.sln -c Release --no-restore -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest-recommended -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true

  csharpier:
    name: csharpier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .
