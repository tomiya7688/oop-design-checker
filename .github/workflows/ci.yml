name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  normal-ci:
    name: normal-ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OopDesignChecker.sln

      - name: Build
        run: dotnet build OopDesignChecker.sln -c Release --no-restore

      - name: Rule smoke tests
        run: dotnet run --project tests/OopDesignChecker.Tests/OopDesignChecker.Tests.csproj -c Release --no-build

  self-check:
    name: self-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OopDesignChecker.sln

      - name: Build checker
        run: dotnet build OopDesignChecker.sln -c Release --no-restore

      - name: Strict OOP self-check
        run: dotnet run --project src/frontends/cui/OopDesignChecker.Cui.csproj -c Release --no-build -- src --fail-on attention

  code-analyzers:
    name: code-analyzers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OopDesignChecker.sln

      - name: .NET analyzers
        run: dotnet build OopDesignChecker.sln -c Release --no-restore -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest-recommended -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true

  csharpier:
    name: csharpier
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Format repository
        run: dotnet csharpier format .

      - name: Commit baseline formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply CSharpier formatting"
          git push origin HEAD:${{ github.head_ref }}
